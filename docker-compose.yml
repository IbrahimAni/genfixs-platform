services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: genfixs
      POSTGRES_PASSWORD: genfixs
      POSTGRES_DB: genfixs
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U genfixs']
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    volumes:
      - redisdata:/data

  api:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      DATABASE_URL: postgres://genfixs:genfixs@postgres:5432/genfixs
      REDIS_URL: redis://redis:6379
      # Provide the rest via .env — see CREDENTIALS.md:
      GENFIXS_API_TOKEN: ${GENFIXS_API_TOKEN:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GITHUB_APP_ID: ${GITHUB_APP_ID:-}
      GITHUB_APP_PRIVATE_KEY: ${GITHUB_APP_PRIVATE_KEY:-}
      GITHUB_APP_INSTALLATION_ID: ${GITHUB_APP_INSTALLATION_ID:-}
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:-}
    volumes:
      - artifacts:/data
    ports:
      - '4000:4000'

volumes:
  pgdata:
  redisdata:
  artifacts:
