name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: genfixs
          POSTGRES_PASSWORD: genfixs
          POSTGRES_DB: genfixs
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U genfixs" --health-interval 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm -r typecheck
      - run: npx playwright install chromium --with-deps
      - run: pnpm test
        env:
          DATABASE_URL: postgres://genfixs:genfixs@localhost:5432/genfixs
          REDIS_URL: redis://localhost:6379
      - run: pnpm --filter @genfixs/web build
